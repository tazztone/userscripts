name: Userscripts CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  toppreise-quality-gates:
    name: Toppreise Quality Gates & Fast Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Userscript Bundle Drift (--check)
        run: node toppreise/tools/build.js --check

      - name: Run Domain & State Unit Tests
        run: node --test toppreise/tests/unit/*.test.js

      - name: Verify Category Taxonomy Coverage
        run: python3 toppreise/tools/verify_category_map.py

      - name: Run Hugging Face Node Unit Tests
        run: node --test huggingface/tests/test_logic.js

  playwright-e2e:
    name: Userscripts Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright
          playwright install --with-deps chromium

      - name: Run Targeted UI Modal Suite
        run: pytest toppreise/tests/test_ui_modal.py -o addopts="--import-mode=importlib"

      - name: Run Targeted Feed Scanner Suite
        run: pytest toppreise/tests/test_feed_scanner.py -o addopts="--import-mode=importlib"

      - name: Run Targeted Catalog Layout Suite
        run: pytest toppreise/tests/test_catalog_layout.py -o addopts="--import-mode=importlib"

      - name: Run Hugging Face Tests
        run: pytest huggingface/tests/ -o addopts="--import-mode=importlib"

      - name: Run Perplexity Tests
        run: pytest perplexity/tests/ -o addopts="--import-mode=importlib"
